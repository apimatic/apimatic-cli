openapi: 3.1.0
info: { title: Inventory, version: 1.0.0 }
paths:
  /items:
    post:
      tags: [Items]
      operationId: CreateItem
      summary: Create item
      requestBody:
        content:
          application/json:
            schema: { $ref: './schemas/item.yaml' }
            examples:
              widget: { summary: Widget, value: { name: widget } }
              gadget: { summary: Gadget, value: { name: gadget } }
      responses: { '201': { description: Created } }
  /health:
    get:
      tags: [Health]
      operationId: InventoryHealth
      summary: Inventory health
      responses: { '200': { description: OK } }
