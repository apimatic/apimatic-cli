openapi: 3.0.3
info:
  title: Combine
  version: '1.0'
servers:
  - url: https://api.example.com
tags:
  - name: cases
components:
  schemas:
    Body:
      type: object
      required: [id]
      properties:
        id:
          type: string
paths:
  # S01: body {alpha, beta}; query {gamma, beta} - beta overlaps, gamma is param-only and listed first
  /s01:
    post:
      operationId: S01Overlap
      tags: [cases]
      parameters:
        - name: region
          in: query
          schema: { type: string }
          examples:
            gamma: { value: region-gamma }
            beta: { value: region-beta }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              alpha: { value: { id: body-alpha } }
              beta: { value: { id: body-beta } }
      responses: { '200': { description: OK } }
  # S02: body {alpha, beta}; query {gamma, delta} - fully disjoint
  /s02:
    post:
      operationId: S02Disjoint
      tags: [cases]
      parameters:
        - name: region
          in: query
          schema: { type: string }
          examples:
            gamma: { value: region-gamma }
            delta: { value: region-delta }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              alpha: { value: { id: body-alpha } }
              beta: { value: { id: body-beta } }
      responses: { '200': { description: OK } }
  # S03: no body; query {summary, full}
  /s03:
    get:
      operationId: S03QueryOnlyTwoIds
      tags: [cases]
      parameters:
        - name: view
          in: query
          schema: { type: string }
          examples:
            summary: { value: view-summary }
            full: { value: view-full }
      responses: { '200': { description: OK } }
  # S04: no body; query {only}
  /s04:
    get:
      operationId: S04QueryOnlyOneId
      tags: [cases]
      parameters:
        - name: view
          in: query
          schema: { type: string }
          examples:
            only: { value: view-only }
      responses: { '200': { description: OK } }
  # S05: no body; path {byId}; query {summary, full} - query outranks path
  /s05/{itemId}:
    get:
      operationId: S05PathAndQuery
      tags: [cases]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
          examples:
            byId: { value: item-byId }
        - name: view
          in: query
          schema: { type: string }
          examples:
            summary: { value: view-summary }
            full: { value: view-full }
      responses: { '200': { description: OK } }
  # S06: body has a singular `example`; query {q1, q2}
  /s06:
    post:
      operationId: S06BodySingularExample
      tags: [cases]
      parameters:
        - name: region
          in: query
          schema: { type: string }
          examples:
            q1: { value: region-q1 }
            q2: { value: region-q2 }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            example: { id: body-singular }
      responses: { '200': { description: OK } }
  # S07: body has no example at all; query {q1, q2}
  /s07:
    post:
      operationId: S07BodyNoExample
      tags: [cases]
      parameters:
        - name: region
          in: query
          schema: { type: string }
          examples:
            q1: { value: region-q1 }
            q2: { value: region-q2 }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
      responses: { '200': { description: OK } }
  # S08: body {Example, alpha} - a key literally named Example beside a named one
  /s08:
    post:
      operationId: S08BodyExampleKeyBesideNamed
      tags: [cases]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              Example: { value: { id: body-Example } }
              alpha: { value: { id: body-alpha } }
      responses: { '200': { description: OK } }
  # S09: body {Example} only; query {q1, q2}
  /s09:
    post:
      operationId: S09BodyOnlyExampleKey
      tags: [cases]
      parameters:
        - name: region
          in: query
          schema: { type: string }
          examples:
            q1: { value: region-q1 }
            q2: { value: region-q2 }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              Example: { value: { id: body-Example } }
      responses: { '200': { description: OK } }
  # S10: body {a, b}; path-item-level path param {b, a}; header {b, z} - overlaps in another order
  /s10/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string }
        examples:
          b: { value: item-b }
          a: { value: item-a }
    post:
      operationId: S10OverlapOtherOrder
      tags: [cases]
      parameters:
        - name: X-Trace
          in: header
          schema: { type: string }
          examples:
            b: { value: trace-b }
            z: { value: trace-z }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              a: { value: { id: body-a } }
              b: { value: { id: body-b } }
      responses: { '200': { description: OK } }
  # S11: body {a}; a required query and an optional query, neither with examples
  /s11:
    post:
      operationId: S11ParamsWithoutExamples
      tags: [cases]
      parameters:
        - name: must
          in: query
          required: true
          schema: { type: string }
        - name: may
          in: query
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              a: { value: { id: body-a } }
      responses: { '200': { description: OK } }
  # S12: XML body {x1, x2} declared first, JSON body {j1}
  /s12:
    post:
      operationId: S12TwoMediaTypes
      tags: [cases]
      requestBody:
        content:
          application/xml:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              x1: { value: '<Body><id>xml-x1</id></Body>' }
              x2: { value: '<Body><id>xml-x2</id></Body>' }
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              j1: { value: { id: json-j1 } }
      responses: { '200': { description: OK } }
  # S13: no body; query {minimal, full}; header {withTax, noTax} - two params, different ids
  /s13:
    get:
      operationId: S13QueryAndHeaderDisjoint
      tags: [cases]
      parameters:
        - name: view
          in: query
          schema: { type: string }
          examples:
            minimal: { value: view-minimal }
            full: { value: view-full }
        - name: X-Tax
          in: header
          schema: { type: string }
          examples:
            withTax: { value: tax-withTax }
            noTax: { value: tax-noTax }
      responses: { '200': { description: OK } }
  # S14: body {Alpha}; query {alpha, Alpha} - ids differ only by case
  /s14:
    post:
      operationId: S14CaseSensitiveIds
      tags: [cases]
      parameters:
        - name: region
          in: query
          schema: { type: string }
          examples:
            alpha: { value: region-lower }
            Alpha: { value: region-upper }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              Alpha: { value: { id: body-Alpha } }
      responses: { '200': { description: OK } }
  # S15: body examples carry summaries; query overlaps on one id
  /s15:
    post:
      operationId: S15Summaries
      tags: [cases]
      parameters:
        - name: region
          in: query
          schema: { type: string }
          examples:
            eu: { value: region-eu }
            us: { value: region-us }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Body' }
            examples:
              us: { summary: US order, value: { id: body-us } }
              eu: { summary: EU order, value: { id: body-eu } }
      responses: { '200': { description: OK } }
