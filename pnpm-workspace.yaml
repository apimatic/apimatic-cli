allowBuilds:
  esbuild: true
enablePrePostScripts: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@apimatic/*'
blockExoticSubdeps: true
overrides:
  diff: ^8.0.4
  inflight: npm:lru-cache@^7.14.1
  lodash.get: npm:lodash@^4.17.21
  '@humanwhocodes/config-array': npm:@eslint/config-array@latest
  rimraf: ^6.0.1
  glob: ^13.0.0
  q: npm:promise@^8.3.0
  semver: "^7.7.0"
  '@oclif/core': "4.11.0"
  oclif: "4.17.34"
  browserslist: "4.24.4"
  '@scalar/json-magic>undici': 7.29.1
  # Their engines start above the CLI's Node floor, and the CLI loads neither: one serves `generateFiles()` in watch mode, the other the server proxy.
  'fumadocs-openapi>chokidar': ^5.0.0
  'fumadocs-openapi>undici': 7.29.1
  '@types/node': $@types/node
