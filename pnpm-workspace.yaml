allowBuilds:
  esbuild: true
enablePrePostScripts: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@apimatic/*'
blockExoticSubdeps: true
overrides:
  diff: ^8.0.4
  inflight: npm:lru-cache@^7.14.1
  lodash.get: npm:lodash@^4.17.21
  '@humanwhocodes/config-array': npm:@eslint/config-array@latest
  rimraf: ^6.0.1
  glob: ^13.0.0
  q: npm:promise@^8.3.0
  semver: "^7.7.0"
  '@oclif/core': "4.11.0"
  oclif: "4.17.34"
  browserslist: "4.24.4"
  # fumadocs-openapi 12.6 asks for chokidar 6 (Node 22.22 and up) and undici 8 (22.19 and up), above
  # the CLI's 22.14 floor, which fails CI's `--engine-strict` install. The CLI loads neither: chokidar
  # serves `generateFiles()` in watch mode, undici the server proxy. Held at chokidar 5, which 12.5.0
  # shipped with, and at the patched undici 7.30.1 that @scalar/json-magic 0.16 pins as well. The
  # overrides reach CI alone: `npm install -g` ignores them, prints an EBADENGINE warning for each of
  # the two on Node 22.14, and installs all the same.
  'fumadocs-openapi>chokidar': ^5.0.0
  'fumadocs-openapi>undici': 7.30.1
  '@types/node': $@types/node
