allowBuilds:
  esbuild: true
enablePrePostScripts: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Quarantined until 2026-10-06, and taken early: 16.15.17 links "View as Markdown" under
  # the base path (apimatic/apimatic-io#2275), on top of 16.15.15's stringifier fix for
  # apimatic/apimatic-io#2260, without which no portal page may contain bold text.
  - 'fumadocs-core'
  - 'fumadocs-ui'
  - 'mdast-util-to-markdown'
  - '@apimatic/*'
blockExoticSubdeps: true
overrides:
  diff: ^8.0.4
  inflight: npm:lru-cache@^7.14.1
  lodash.get: npm:lodash@^4.17.21
  '@humanwhocodes/config-array': npm:@eslint/config-array@latest
  rimraf: ^6.0.1
  glob: ^13.0.0
  q: npm:promise@^8.3.0
  semver: "^7.7.0"
  '@oclif/core': "4.11.0"
  oclif: "4.17.34"
  browserslist: "4.24.4"
