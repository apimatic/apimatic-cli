name: Release

on:
  push:
    branches: [ alpha, beta, main, "1.x" ]

permissions:
  id-token: write  # Required for OIDC
  contents: write       # needed by @semantic-release/github to needed to push tags/version commits
  issues: write         # needed by @semantic-release/github
  pull-requests: write  # needed if semantic-release comments on PRs

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep this resolving to 24.5.0 or newer: npm trusted publishing (OIDC) needs
        # npm >= 11.5.1, and Node 24.5.0 is the first release whose bundled npm clears that.
        node: [ '24' ]
    name: Release with Node version ${{ matrix.node }}
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          repository: apimatic/apimatic-cli
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: cli

      # Corepack is not distributed with Node 25 and newer.
      - name: setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.0.8
          standalone: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: cli/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: Check Build
        working-directory: 'cli'
        run: pnpm build

      - name: Release
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
